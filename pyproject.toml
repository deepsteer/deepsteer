[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsteer"
version = "0.2.0"
description = "Evaluating and steering alignment depth in LLM pre-training"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Orion Reblitz-Richardson"},
]

dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "accelerate",
    "datasets",
    "numpy",
    "matplotlib",
    "seaborn",
    "pandas",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/deepsteer/deepsteer"
Repository = "https://github.com/deepsteer/deepsteer"
Issues = "https://github.com/deepsteer/deepsteer/issues"

[project.optional-dependencies]
api = [
    "anthropic",
    "openai",
]
lora = [
    "peft>=0.11",
]
papers = [
    # Analysis-only deps for papers/ scripts (clustering, taxonomy). Not used
    # by the deepsteer/ core library, so kept out of the default install.
    "scikit-learn",
]
all = [
    "deepsteer[api]",
    "deepsteer[lora]",
    "deepsteer[papers]",
]
dev = [
    "deepsteer[all]",
    "pytest",
    "ruff==0.16.7",  # pinned to the version CI runs
    "import-linter==2.15",
]

[tool.setuptools.packages.find]
include = ["deepsteer*"]
exclude = ["papers*", "outputs*", "tests*", "scripts*"]

# Non-.py files the library reads at runtime via Path(__file__). Keep this list exact:
# datasets/ also holds JSON read only by papers/ scripts and the EM training corpora,
# which are not shipped in the wheel.
[tool.setuptools.package-data]
deepsteer = [
    "datasets/moral_probing_v2.json",
    "datasets/dilemma_pairs_final.json",
    "datasets/dilemma_pairs_validated.json",
    "datasets/DATASET_LICENSES.md",
    "benchmarks/compliance_gap/em_fixtures/first_plot_questions.yaml",
    "benchmarks/compliance_gap/em_fixtures/LICENSE",
]

# Import contracts, checked by `lint-imports` in CI (LIBRARY_RELEASE_PLAN §C3). They see Python
# imports only: a repo-relative file read (deepsteer/kdg/phase2.py reads papers/kdg_panel/data)
# is invisible to them; ARCHITECTURE.md (Experimental) tracks that one.
[tool.importlinter]
root_packages = ["deepsteer"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "library does not import papers, scripts or tests"
type = "forbidden"
source_modules = ["deepsteer"]
forbidden_modules = ["papers", "scripts", "tests"]

[[tool.importlinter.contracts]]
name = "geometry and direction algorithms do not import torch or transformers"
type = "forbidden"
source_modules = [
    "deepsteer.geometry",
    "deepsteer.directions.mean_diff",
    "deepsteer.directions.leace",
    "deepsteer.directions.compare",
    "deepsteer.directions.probe_weight",
]
forbidden_modules = ["torch", "transformers"]

[tool.ruff]
line-length = 100
# Lint scope is the library, its tests, and scripts/ (LIBRARY_RELEASE_PLAN §B). Excluded:
# papers/ (research code, left as-is by the plan); the W4 pod harness, frozen since the W4
# verdicts (2026-09-13) and pinned by commit SHA in its run manifests.
extend-exclude = [
    "papers",
    "scripts/w4",
    "scripts/pod_w4.py",
    "tests/scripts/test_pod_w4.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Prose data held as string literals (sentence pairs, scenarios, verbatim vendored judge
# prompts). Wrapping them risks changing the data.
"deepsteer/datasets/minimal_pairs.py" = ["E501"]
"deepsteer/datasets/persona_pairs.py" = ["E501"]
"deepsteer/datasets/severity_twins.py" = ["E501"]
"deepsteer/datasets/request_twins.py" = ["E501"]
"deepsteer/datasets/request_twins_w4.py" = ["E501"]
"deepsteer/datasets/boundary_twins.py" = ["E501"]
"deepsteer/benchmarks/moral_reasoning/foundations.py" = ["E501"]
"deepsteer/benchmarks/compliance_gap/em_behavioral.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that require real model weights (deselect with '-m \"not slow\"')",
    "regression: marks regression tests against paper outputs (requires model weights)",
]
