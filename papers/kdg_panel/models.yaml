# Phase 1 (KDG_PHASE1_SPEC.md §3; plan item 5, 2026-09-26). Revisions pinned to the HF sha read
# 2026-09-26; the pod manifest records the resolved commit and a mismatch is logged (spec §7).
# template_sha256 = sha256 of the chat-template TEXT (chat_template.jinja if present, else
# tokenizer_config.chat_template), the same convention as the manifest's chat_template_sha256
# (reproduces f5186d42... for olmo3_instruct at 6e5971d9). Gated repos: hash recorded at load.
#
# Fork criterion for stage checkpoints (fixed 2026-09-26, before any stage data): template TEXT
# drift is a fork only if it changes the RENDERED prompt of a harness call. OLMo-3 SFT and DPO
# share template edbb35ef... which differs from the final Instruct's f5186d42... in one condition
# (`tools is none` vs `tools is none or (tools | length) == 0`). Rendered locally (jinja2, the
# harness's call: tools=None, add_generation_prompt=True) on user-only, system+user and
# three-turn F2 conversations: byte-identical across the three checkpoints. With tools=[] they
# would differ; the harness never passes tools. The pod asserts per chat cell that the rendered
# prompt sha equals the final Instruct's for the same messages (spec Z3 local test).
# Option letters: " A".." D" (raw) and "A".."D" (chat) are single tokens on OLMo-3 SFT, Qwen2.5
# base and instruct, and the Llama-3.1 tokenizer (checked on Tulu-3's public copy), 2026-09-26.
phase1:
  olmo3_sft:
    repo: allenai/Olmo-3-7B-Instruct-SFT
